      particle.style.setProperty("--dx", Math.cos(angle) * distance + "px");
      particle.style.setProperty("--dy", Math.sin(angle) * distance + "px");
      particle.style.setProperty("--particle-color", colors[i % colors.length]);
      document.body.appendChild(particle);
      setTimeout(function (node) {
        node.remove();
      }, 720, particle);
    }
  }

  document.addEventListener("pointerdown", function (event) {
    if (event.button !== 0 && event.pointerType === "mouse") return;
    createClickEffect(event.clientX, event.clientY);
  });

  function getCodeText(block) {
    var code = block.querySelector(".code pre") || block.querySelector("pre");
    return code ? code.innerText.replace(/\n$/, "") : "";
  }

  document.querySelectorAll(".post-body figure.highlight").forEach(function (block) {
    if (block.querySelector(".code-toolbar")) return;

    var language = Array.from(block.classList).filter(function (name) {
      return name !== "highlight";
    })[0] || "code";

    var toolbar = document.createElement("div");
    toolbar.className = "code-toolbar";
    toolbar.innerHTML = "<span>" + language.toUpperCase() + "</span><button class=\"code-copy-button\" type=\"button\">Copy</button>";
    block.insertBefore(toolbar, block.firstChild);

    toolbar.querySelector("button").addEventListener("click", function () {
      var button = this;
      var text = getCodeText(block);
      var copied = function () {
        button.textContent = "Copied";
        setTimeout(function () {
          button.textContent = "Copy";
        }, 1500);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(copied);
      } else {
        var textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        copied();
      }
    });
  });

  var searchForm = document.querySelector(".js-search");
  var searchInput = searchForm && searchForm.querySelector(".text-input");
  var searchResults = searchForm && searchForm.querySelector(".search-results");
  var searchIndex = [];

  function renderSearch(query) {
    if (!searchResults) return;
    var q = query.trim().toLowerCase();
    if (!q) {
      searchResults.innerHTML = '<p class="search-empty">Type to search posts.</p>';
      return;
    }

    var results = searchIndex.filter(function (item) {
      return (item.title + " " + item.text).toLowerCase().indexOf(q) !== -1;
    }).slice(0, 12);

    if (!results.length) {
      searchResults.innerHTML = '<p class="search-empty">No matching posts.</p>';
      return;
    }

    searchResults.innerHTML = results.map(function (item) {
      return '<a class="search-result" href="' + item.path + '"><strong>' + item.title + '</strong><span>' + item.date + '</span></a>';
    }).join("");
  }

  if (searchForm && searchInput) {
    fetch("/search.json")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        searchIndex = Array.isArray(data) ? data : [];
        renderSearch(searchInput.value || "");
      })
      .catch(function () {
        if (searchResults) searchResults.innerHTML = '<p class="search-empty">Search index is not ready.</p>';
      });

    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      renderSearch(searchInput.value || "");
    });

    searchInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        event.stopPropagation();
        renderSearch(searchInput.value || "");
      }
    }, true);

    searchInput.addEventListener("input", function () {
      renderSearch(searchInput.value || "");
    });
  }

  var links = Array.from(document.querySelectorAll(".post-toc a[href^='#']"));
  if (links.length) {
    var headings = links.map(function (link) {
      return document.getElementById(decodeURIComponent(link.getAttribute("href").slice(1)));
    }).filter(Boolean);

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        links.forEach(function (link) {
          var active = decodeURIComponent(link.getAttribute("href").slice(1)) === entry.target.id;
          link.classList.toggle("is-active", active);
          if (active) {
            var parent = link.closest("details");
            while (parent) {
              parent.open = true;
              parent = parent.parentElement && parent.parentElement.closest("details");
            }
          }
        });
      });
    }, { rootMargin: "-20% 0px -70% 0px", threshold: 0 });

    headings.forEach(function (heading) {
      observer.observe(heading);
    });
  }
})();
