<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320" role="img" aria-label="ELF startup lifecycle">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b4252"/>
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #4c566a; stroke-width: 2; rx: 10; }
      .accent { fill: #e8f0ff; stroke: #315fbd; }
      .exit { fill: #fff4e5; stroke: #b36b00; }
      .text { font-family: Consolas, Menlo, monospace; font-size: 18px; fill: #20242c; }
      .small { font-family: Consolas, Menlo, monospace; font-size: 14px; fill: #4c566a; }
      .line { stroke: #3b4252; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="30" y="80" width="130" height="78" class="box"/>
  <text x="95" y="112" text-anchor="middle" class="text">_start</text>
  <text x="95" y="138" text-anchor="middle" class="small">ELF entry</text>

  <line x1="160" y1="119" x2="225" y2="119" class="line"/>
  <rect x="230" y="80" width="170" height="78" class="box"/>
  <text x="315" y="112" text-anchor="middle" class="text">runtime</text>
  <text x="315" y="138" text-anchor="middle" class="small">crt + libc setup</text>

  <line x1="400" y1="119" x2="465" y2="119" class="line"/>
  <rect x="470" y="50" width="180" height="138" class="box accent"/>
  <text x="560" y="86" text-anchor="middle" class="text">constructors</text>
  <text x="560" y="116" text-anchor="middle" class="small">.preinit_array</text>
  <text x="560" y="140" text-anchor="middle" class="small">.init</text>
  <text x="560" y="164" text-anchor="middle" class="small">.init_array</text>

  <line x1="650" y1="119" x2="715" y2="119" class="line"/>
  <rect x="720" y="80" width="120" height="78" class="box"/>
  <text x="780" y="112" text-anchor="middle" class="text">main</text>
  <text x="780" y="138" text-anchor="middle" class="small">user code</text>

  <line x1="780" y1="158" x2="780" y2="230" class="line"/>
  <rect x="690" y="235" width="180" height="58" class="box exit"/>
  <text x="780" y="270" text-anchor="middle" class="text">destructors</text>

  <line x1="690" y1="264" x2="590" y2="264" class="line"/>
  <text x="565" y="270" text-anchor="end" class="small">.fini_array / .fini</text>
</svg>
